[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shasthosetu-api"
version = "0.2.0"
description = "ShasthoSetu AI FastAPI + SQLite WAL Transactional Backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "argon2-cffi>=23.1.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
